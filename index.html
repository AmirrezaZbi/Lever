<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="dark">
<meta name="description" content="Bodyweight endurance and back-friendly core training.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Lever</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Inter-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Inter-Medium.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face { font-family:"Inter"; font-weight:300; font-style:normal; font-display:swap; src:url(fonts/Inter-Light.woff) format("woff"); }
@font-face { font-family:"Inter"; font-weight:400; font-style:normal; font-display:swap; src:url(fonts/Inter-Regular.woff) format("woff"); }
@font-face { font-family:"Inter"; font-weight:500; font-style:normal; font-display:swap; src:url(fonts/Inter-Medium.woff) format("woff"); }
@font-face { font-family:"Inter"; font-weight:600; font-style:normal; font-display:swap; src:url(fonts/Inter-SemiBold.woff) format("woff"); }
@font-face { font-family:"Inter Display"; font-weight:300; font-style:normal; font-display:swap; src:url(fonts/InterDisplay-Light.woff) format("woff"); }
@font-face { font-family:"Inter Display"; font-weight:400; font-style:normal; font-display:swap; src:url(fonts/InterDisplay-Regular.woff) format("woff"); }
html { background:#0c0c0e; }
[hidden] { display:none !important; }
h1 { font-family:"Inter Display", "Inter", system-ui, -apple-system, sans-serif; }
@media (display-mode: standalone) { body { overscroll-behavior-y:none; } }
</style>
<style>
/* Elegance pass: light display weights, large light numerals for key figures, fewer filled shapes,
   monochrome primary button; ultramarine is reserved for "live", the active tab and the current exercise.
   Layout: 440px phone column. Two layers, one rule:
   1. Content is flat: type sets the hierarchy, rows sit on hairlines, generous air, no cards.
   2. Glass marks elevation only: what floats over content (top bar on scroll, set dock, tab bar, toast).
   Inter throughout: display optical size for titles, tabular figures for every number.
   Accent (soft ultramarine) appears on the single primary action, the active tab, and "live". */
:root {
  color-scheme: dark;
  --bg:#0c0c0e;
  --text-primary:#ededef; --text-secondary:#a3a3ab; --text-faint:#6b6b74; --text-ghost:#7a7a84;
  --hair:rgba(255,255,255,.055); --hover:rgba(255,255,255,.025); --fill:rgba(255,255,255,.045); --fill-strong:rgba(255,255,255,.08);
  --ink-btn:#efefef; --ink-btn-hover:#ffffff; --ink-btn-press:#d9d9dc; --ink-btn-fg:#0b0b0d;
  --accent:#7d93ff; --accent-hover:#7f95ff; --accent-press:#5a73ee; --accent-soft:rgba(107,132,255,.16); --on-accent:#ffffff;
  --success:#5ccf9e; --muted:#3d3d44;
  --fig-near:#e6e6ea; --fig-far:#55555c; --fig-torso:#d4d4d9;
  --focus-ring:#aab8ff;
  --glass-fill:rgba(20,20,24,.74); --glass-edge:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.06);
  --glass-blur:blur(28px) saturate(160%);
  --glass-shadow:0 1px 0 var(--glass-hi) inset, 0 18px 48px -12px rgba(0,0,0,.6);
  --font:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-control:10px; --r-float:24px;
  --ease-standard:cubic-bezier(.2,0,0,1);
  --spring:cubic-bezier(.2,.8,.2,1); --spring-dur:450ms;
}
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--text-primary); font-family:var(--font); font-size:15px; line-height:1.5; letter-spacing:-0.006em;
  font-optical-sizing:auto; font-feature-settings:"cv11","ss03"; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
button { font:inherit; letter-spacing:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
:focus-visible { outline:1.5px solid var(--focus-ring); outline-offset:3px; border-radius:var(--r-control); }
[hidden] { display:none !important; }
.mono { font-variant-numeric:tabular-nums; font-feature-settings:"tnum","cv11","ss03"; }

.glass { background:var(--glass-fill); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border:.5px solid var(--glass-edge); box-shadow:var(--glass-shadow); }
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) { .glass { background:rgba(22,22,26,.97); } }

.phone { position:relative; z-index:1; max-width:440px; margin:0 auto; min-height:100%; padding-inline:24px; box-sizing:border-box; }

/* Top bar */
.topbar { position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; height:48px; margin-inline:-24px; padding-inline:24px;
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; letter-spacing:-0.01em;
  border-bottom:.5px solid transparent; transition:background-color 220ms var(--ease-standard), border-color 220ms var(--ease-standard); }
.topbar.on { background:var(--glass-fill); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur); border-bottom-color:var(--glass-edge); }
.topbar .t { opacity:0; transform:translateY(6px); transition:opacity 180ms var(--ease-standard), transform var(--spring-dur) var(--spring); }
.topbar.on .t { opacity:1; transform:none; }
.brand { position:absolute; left:24px; display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; letter-spacing:.01em; color:var(--text-secondary); transition:opacity 180ms var(--ease-standard); }
.topbar.on .brand { opacity:0; }
.mark { width:18px; height:18px; border-radius:5px; background:var(--accent); display:grid; place-items:center; }

main { padding-block:20px calc(120px + env(safe-area-inset-bottom, 0px)); }
main.with-dock { padding-bottom:calc(230px + env(safe-area-inset-bottom, 0px)); }
.col { display:flex; flex-direction:column; gap:56px; }

/* Hierarchy: eyebrow → title → meta → action. Sections: small caps label, then rows. */
.lead { display:flex; flex-direction:column; gap:12px; }
.eyebrow { font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
h1 { margin:0; font-size:46px; line-height:1.02; font-weight:400; letter-spacing:-0.045em; text-wrap:balance; }
h1.ex { font-size:34px; letter-spacing:-0.035em; }
.meta { font-size:14px; color:var(--text-secondary); display:flex; gap:4px 18px; flex-wrap:wrap; }
.meta b { font-weight:500; color:var(--text-primary); }
.lead-actions { display:flex; flex-direction:column; gap:16px; margin-top:18px; }
.section { display:flex; flex-direction:column; gap:12px; }
.section-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
h2 { margin:0; font-size:15px; font-weight:600; letter-spacing:-0.01em; color:var(--text-primary); }
.section-head .note { font-size:12px; color:var(--text-faint); }

/* Key figures: large, light numerals with a small caption */
.stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); margin-top:8px; border-top:.5px solid var(--hair); }
.stat { display:flex; flex-direction:column; gap:2px; padding-top:14px; }
.stat + .stat { padding-left:18px; border-left:.5px solid var(--hair); }
.stat .num { font-size:30px; font-weight:300; letter-spacing:-0.035em; line-height:1; font-variant-numeric:tabular-nums; }
.stat .lbl { font-size:12px; color:var(--text-faint); }

/* Buttons */
.btn { height:52px; padding:0 22px; border-radius:26px; font-size:15px; font-weight:500; letter-spacing:-0.01em; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap;
  transition:background-color 160ms var(--ease-standard), transform 100ms var(--ease-standard); }
.btn:active { transform:scale(.98); }
.btn-primary { background:var(--ink-btn); color:var(--ink-btn-fg); font-weight:500; }
.btn-primary:hover { background:var(--ink-btn-hover); }
.btn-primary:active { background:var(--ink-btn-press); }
.btn-quiet { height:36px; padding:0 12px; font-size:14px; font-weight:500; color:var(--text-faint); border-radius:var(--r-control);
  transition:background-color 150ms var(--ease-standard), color 150ms var(--ease-standard); }
.btn-quiet:hover { background:var(--fill); color:var(--text-primary); }
.btn-wide { width:100%; }
.icon-btn { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; color:var(--text-faint); transition:background-color 150ms var(--ease-standard), color 150ms var(--ease-standard); }
.icon-btn:hover { background:var(--fill); color:var(--text-primary); }
.icon-btn[disabled] { opacity:.25; pointer-events:none; }
.icon-btn svg { width:15px; height:15px; }

/* Segmented: text-led, underline-free, a single soft fill */
.seg { display:flex; gap:2px; align-self:flex-start; }
.seg button { height:30px; padding:0 12px; border-radius:8px; font-size:13px; font-weight:500; color:var(--text-faint); display:inline-flex; align-items:center; gap:6px;
  transition:background-color 150ms var(--ease-standard), color 150ms var(--ease-standard); }
.seg button:hover { color:var(--text-primary); }
.seg button[aria-pressed="true"] { background:var(--fill-strong); color:var(--text-primary); }
.seg .hint { font-size:10px;  color:var(--text-ghost); }

/* Rows on hairlines */
.rows { border-top:.5px solid var(--hair); }
.row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:baseline; padding:18px 0; border-bottom:.5px solid var(--hair); }
button.row { width:100%; text-align:left; transition:background-color 150ms var(--ease-standard); }
button.row:hover { background:var(--hover); }
button.row:active { background:var(--fill); }
.idx { font-size:11px; color:var(--text-ghost); font-variant-numeric:tabular-nums; }
.row-main { display:flex; flex-direction:column; gap:3px; min-width:0; }
.row-title { font-size:16px; font-weight:400; letter-spacing:-0.015em; }
.row-sub { font-size:13px; color:var(--text-faint); }
.row-side { text-align:right; display:flex; flex-direction:column; gap:3px; align-items:flex-end; }
.row-side .a { font-size:13px; color:var(--text-secondary); }
.row-side .b { font-size:12px; color:var(--text-faint); }
.row.current .idx { color:var(--accent); }
.row:not(.current) .row-title { color:var(--text-primary); }
.status { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:500; color:var(--text-secondary); white-space:nowrap; letter-spacing:0; }
.dot { width:5px; height:5px; border-radius:50%; flex:none; background:var(--muted); }
.dot.success { background:var(--success); }
.dot.live { background:var(--accent);  }
.live { color:var(--accent); display:inline-flex; align-items:center; gap:8px; }

/* Week strip */
.week { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); border-top:.5px solid var(--hair); border-bottom:.5px solid var(--hair); padding:14px 0; }
.wd { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:10px; font-weight:500;  color:var(--text-ghost); }
.wd .n { font-size:14px; font-weight:400; letter-spacing:0; color:var(--text-secondary); width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
.wd.today { color:var(--text-faint); }
.wd.today .n { box-shadow:inset 0 0 0 .5px var(--text-secondary); color:var(--text-primary); }
.wd .mk { width:4px; height:4px; border-radius:50%; }
.wd.done .mk { background:var(--text-secondary); }

/* Ladder */
.track { grid-column:1 / -1; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:4px; margin-top:12px; }
.track i { height:2px; border-radius:1px; background:var(--fill-strong); }
.track i.done { background:var(--text-faint); }
.track i.cur { background:var(--text-primary); }
.row.skill { align-items:center; }
.skill-actions { display:flex; gap:2px; }

/* Session sets */
.sets { display:flex; gap:4px 26px; flex-wrap:wrap; align-items:baseline; margin-top:18px; padding-top:16px; border-top:.5px solid var(--hair); }
.set { display:inline-flex; flex-direction:column; gap:2px; font-size:30px; font-weight:300; letter-spacing:-0.035em; line-height:1; font-variant-numeric:tabular-nums; }
.set small { font-size:10.5px; font-weight:500;  color:var(--text-faint); }
.set.todo { color:var(--text-ghost); }
.set.todo small { color:var(--text-ghost); }
.setting { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0; border-bottom:.5px solid var(--hair); font-size:14px; color:var(--text-secondary); }
.toggle { width:34px; height:20px; border-radius:10px; background:var(--fill-strong); position:relative; flex:none; transition:background-color 150ms var(--ease-standard); }
.toggle::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--text-faint);
  transition:transform var(--spring-dur) var(--spring), background-color 150ms var(--ease-standard); }
.toggle[aria-checked="true"] { background:var(--text-primary); }
.toggle[aria-checked="true"]::after { transform:translateX(14px); background:var(--bg); }
.end-actions { display:flex; justify-content:space-between; margin-top:4px; }

/* Chart */
.chart { position:relative; display:grid; grid-template-columns:repeat(8, minmax(0,1fr)); gap:10px; align-items:end; height:120px; border-bottom:.5px solid var(--hair); }
.goal { position:absolute; left:0; right:0; border-top:.5px dashed rgba(255,255,255,.16); }
.goal span { position:absolute; right:0; top:-18px; font-size:10px;  color:var(--text-ghost); }
.bar-col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
.bar-col .v { font-size:10px; color:var(--text-faint); }
.bar-col .bar { width:100%; max-width:4px; border-radius:2px 2px 0 0; background:var(--fill-strong); min-height:2px; }
.bar-col.now .bar { background:var(--text-primary); }
.chart-x { display:grid; grid-template-columns:repeat(8, minmax(0,1fr)); gap:10px; font-size:10px; color:var(--text-ghost); text-align:center; padding-top:8px; }
.detail { padding:0 0 16px 0; display:flex; flex-direction:column; gap:6px; font-size:13px; border-bottom:.5px solid var(--hair); }
.detail-line { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; color:var(--text-secondary); }
.detail-line span:last-child { color:var(--text-faint); }
.empty { padding:28px 0; border-top:.5px solid var(--hair); border-bottom:.5px solid var(--hair); display:flex; flex-direction:column; gap:4px; }
.empty b { font-weight:500; }
.empty span { color:var(--text-faint); font-size:14px; }

/* ---- Floating layer (glass) ---- */
.float { position:fixed; z-index:20; left:50%; transform:translateX(-50%); width:min(392px, calc(100% - 32px)); box-sizing:border-box; }
.tabbar { bottom:calc(14px + env(safe-area-inset-bottom, 0px)); height:60px; border-radius:30px; display:grid; grid-template-columns:repeat(3,1fr); padding:6px; }
.tabbar button { position:relative; z-index:1; border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; font-weight:400; letter-spacing:.01em; color:var(--text-faint); transition:color 150ms var(--ease-standard); }
.tabbar button[aria-current="page"] { color:var(--text-primary); }
.tabbar button[aria-current="page"] svg { color:var(--accent); }
.tabbar svg { width:18px; height:18px; stroke-width:1.4; }
.tabbar .dot { position:absolute; top:8px; right:calc(50% - 15px); }
.tab-thumb { position:absolute; top:6px; left:0; height:48px; border-radius:24px; background:rgba(255,255,255,.065); box-shadow:inset 0 .5px 0 rgba(255,255,255,.08); transition:transform var(--spring-dur) var(--spring); }

.dock { bottom:calc(84px + env(safe-area-inset-bottom, 0px)); border-radius:32px; padding:10px; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
.dock-rest { display:flex; align-items:center; justify-content:space-between; padding:4px 8px 0; font-size:11px; font-weight:500;  color:var(--text-faint); }
.dock-rest .time { font-size:16px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--text-primary); margin-left:8px; font-variant-numeric:tabular-nums; }
.dock-rest .btn-quiet { height:28px; font-size:13px; letter-spacing:0; text-transform:none; }
.rest-line { position:absolute; left:0; right:0; top:0; height:1.5px; }
.rest-line i { display:block; height:100%; background:var(--text-secondary); transform-origin:left; }
.dock-main { display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:center; }
.stepper { display:grid; grid-template-columns:44px 64px 44px; align-items:center; height:52px; border-radius:26px; background:rgba(255,255,255,.05); }
.stepper button { height:52px; border-radius:26px; font-size:20px; font-weight:300; color:var(--text-secondary); transition:background-color 150ms var(--ease-standard); }
.stepper button:active { background:var(--fill-strong); }
.stepper output { text-align:center; line-height:1.1; }
.stepper .v { display:block; font-size:22px; font-weight:300; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.stepper .u { display:block; font-size:10px;  color:var(--text-faint); }

.toast { position:fixed; z-index:30; left:50%; transform:translateX(-50%); top:calc(60px + env(safe-area-inset-top, 0px));
  padding:10px 16px; border-radius:14px; font-size:13px; max-width:calc(100% - 48px); box-sizing:border-box; text-align:center; }

/* ---- Layout primitives ---- */
.layout { display:flex; flex-direction:column; gap:56px; }
.primary, .secondary { display:flex; flex-direction:column; gap:56px; min-width:0; }
.grid-sections { display:flex; flex-direction:column; gap:56px; }
.sidebar { display:none; }
@media (max-width: 767px) { .secondary.first-on-mobile { order:-1; } }

/* ---- Tablet: wider column, glass tab bar floats at the top ---- */
@media (min-width: 768px) {
    .phone { max-width:720px; padding-inline:48px; }
  .topbar { height:76px; margin-inline:-48px; padding-inline:48px; }
  .topbar .t { display:none; }
  .brand { left:48px; }
  .tabbar { top:calc(14px + env(safe-area-inset-top, 0px)); bottom:auto; width:400px; height:48px; padding:4px; border-radius:24px; }
  .tabbar button { flex-direction:row; gap:8px; font-size:13px; border-radius:20px; }
  .tabbar svg { width:16px; height:16px; }
  .tabbar .dot { position:static; }
  .tab-thumb { top:4px; height:40px; border-radius:20px; }
  main { padding-block:40px 120px; }
  main.with-dock { padding-bottom:200px; }
  .dock { bottom:calc(24px + env(safe-area-inset-bottom, 0px)); width:460px; }
  .toast { top:calc(80px + env(safe-area-inset-top, 0px)); }
  h1 { font-size:58px; }
  h1.ex { font-size:44px; }
  .lead-actions { flex-direction:row; align-items:center; gap:20px; }
  .lead-actions .btn-wide { width:auto; min-width:220px; }
  .grid-sections { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:56px 40px; }
}

/* ---- Desktop: floating glass sidebar, two-column content, dock bottom-right ---- */
@media (min-width: 1200px) {
  .topbar, .tabbar { display:none; }
  .sidebar { display:flex; position:fixed; z-index:20; top:16px; bottom:16px; left:16px; width:232px; border-radius:28px; padding:24px 14px 20px; box-sizing:border-box; flex-direction:column; gap:32px; }
  .side-brand { display:flex; align-items:center; gap:10px; padding:0 12px; font-size:14px; font-weight:600; letter-spacing:-0.01em; }
  .side-nav { position:relative; display:flex; flex-direction:column; gap:2px; }
  .side-nav button { position:relative; z-index:1; height:40px; padding:0 12px; border-radius:12px; display:flex; align-items:center; gap:12px; font-size:14px; color:var(--text-faint); transition:color 150ms var(--ease-standard); }
  .side-nav button:hover { color:var(--text-primary); }
  .side-nav button[aria-current="page"] { color:var(--text-primary); }
  .side-nav button[aria-current="page"] svg { color:var(--accent); }
  .side-nav svg { width:17px; height:17px; }
  .side-nav .dot { margin-left:auto; }
  .side-thumb { position:absolute; top:0; left:0; right:0; height:40px; border-radius:12px; background:rgba(255,255,255,.065); box-shadow:inset 0 .5px 0 rgba(255,255,255,.08); transition:transform var(--spring-dur) var(--spring); }
  #sidelive { margin-top:auto; }
  .side-live { display:flex; flex-direction:column; gap:2px; padding:14px 12px; border-top:.5px solid var(--hair); }
  .side-live-title { font-size:14px; font-weight:500; margin-top:4px; }
  .side-live-sub { font-size:12px; color:var(--text-faint); }
  .side-foot { padding:0 12px; font-size:12px; color:var(--text-faint); }
  #sidelive:empty + .side-foot { margin-top:auto; }
    .phone { max-width:none; margin:0; padding-left:calc(16px + 232px + 72px); padding-right:72px; }
  .col { max-width:1040px; }
  main { padding-block:80px 120px; }
  main.with-dock { padding-bottom:180px; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:80px; align-items:start; }
  .secondary { position:sticky; top:40px; }
  .dock { left:auto; right:32px; transform:none; bottom:32px; width:400px; }
  .toast { top:28px; left:calc(50% + 124px); }
  h1 { font-size:68px; }
  h1.ex { font-size:52px; }
}

.row.current .row-side .status { color:var(--accent); }
.row.current .row-title { font-weight:500; }
.set.todo .ph { display:block; width:22px; height:1.5px; background:var(--text-faint); margin:15px 0 13px; }

/* ---- Phase 1: back care ---- */

.pain-scale button:hover { background:var(--fill-strong); color:var(--text-primary); }
.pain-scale button[aria-pressed="true"] { background:var(--text-primary); color:var(--bg); font-weight:600; }
.scale-ends { display:flex; justify-content:space-between; font-size:12px; color:var(--text-faint); }
.where { display:grid; grid-template-columns:104px minmax(0,1fr); gap:16px; align-items:start; }
.bodymap { width:104px; height:auto; }
.k-dash { width:14px; border-top:1px dashed rgba(255,255,255,.4); display:inline-block; }
.bodymap .static { fill:rgba(255,255,255,.07); }

.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip-btn { height:32px; padding:0 12px; border-radius:16px; background:var(--fill); font-size:13px; color:var(--text-secondary); transition:background-color 150ms var(--ease-standard), color 150ms var(--ease-standard); }
.chip-btn:hover { background:var(--fill-strong); color:var(--text-primary); }
.chip-btn[aria-pressed="true"] { background:var(--text-primary); color:var(--bg); }
.note-box { margin:0; font-size:13px; line-height:1.55; color:var(--text-secondary); border-left:2px solid var(--text-faint); padding:2px 0 2px 12px; }
.sheet-actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.btn[disabled] { opacity:.35; pointer-events:none; }
.prose { display:flex; flex-direction:column; gap:12px; max-width:62ch; }
.prose p { margin:0; font-size:15px; line-height:1.6; color:var(--text-secondary); }
.prose h3 { margin:8px 0 0; font-size:15px; font-weight:600; color:var(--text-primary); }
.prose ul { margin:0; padding-left:18px; color:var(--text-secondary); font-size:15px; line-height:1.6; display:flex; flex-direction:column; gap:4px; }
.prose .note-box { margin-top:8px; }
.dock-main.dual { grid-template-columns:minmax(0,1fr) auto; }
/* Pain chart: one series, monochrome; hover any day for its value */
.pchart-wrap { display:flex; flex-direction:column; }
.pchart { position:relative; height:150px; margin:10px 0 0 22px; }
.pchart .gl { position:absolute; left:0; right:0; border-top:.5px solid var(--hair); }
.pchart .gl span { position:absolute; left:-22px; top:-7px; width:14px; text-align:right; font-size:10px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
.pchart .thr { border-top:.5px dashed rgba(255,255,255,.24); }
.pchart .thr em { position:absolute; right:0; top:-16px; font-style:normal; font-size:10px; color:var(--text-faint); }
.pline { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.pline polyline { fill:none; stroke:var(--text-secondary); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round; }
.pcols { position:absolute; inset:0; display:grid; grid-template-columns:repeat(28, minmax(0,1fr)); }
.pcol { position:relative; }
.pcol[data-tip]:hover { background:var(--hover); }
.pcol[data-tip]:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); white-space:nowrap; z-index:3; pointer-events:none;
  background:rgba(28,28,33,.97); border:.5px solid var(--glass-edge); color:var(--text-primary); font-size:12px; padding:6px 9px; border-radius:8px; }

.px { display:flex; justify-content:space-between; margin-left:22px; font-size:10px; color:var(--text-faint); padding-top:6px; }

.pkey span { display:inline-flex; align-items:center; gap:6px; }
.k-dot { width:8px; height:8px; border-radius:50%; background:var(--text-primary); display:inline-block; }
.k-tick { width:2px; height:9px; border-radius:1px; background:var(--text-faint); display:inline-block; }
/* Form check */
.fc { display:flex; flex-direction:column; gap:14px; }
.fc-note { margin:0; font-size:13px; line-height:1.5; color:var(--text-faint); }
.fc-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.select { height:40px; max-width:100%; border-radius:12px; background:var(--fill-strong); color:var(--text-primary); border:0; padding:0 12px; font:inherit; font-size:14px; }

input.time { width:auto; color-scheme:dark; }
.text-in { width:100%; height:44px; box-sizing:border-box; }
.build-row { grid-template-columns:64px minmax(0,1fr) auto; }
.build-ctl { display:flex; align-items:center; gap:6px; }
.mini-step { display:inline-flex; align-items:center; gap:2px; background:var(--fill); border-radius:10px; height:32px; }

.mini-step button:hover { background:var(--fill-strong); color:var(--text-primary); }

.risk { color:var(--text-secondary); }
.add-btn { align-self:flex-start; margin-top:12px; }
.row-actions { display:flex; gap:2px; align-items:center; }
.btn-quiet.strong { color:var(--text-primary); }
.stage-actions { display:flex; gap:4px; flex-wrap:wrap; margin-left:-12px; }
.stage-actions .how { margin-left:0; }
@media (prefers-reduced-motion: reduce) {

svg.fig { display:block; overflow:visible; }

.thumb-btn { display:block; border-radius:8px; }
.as-link { display:flex; flex-direction:column; gap:3px; text-align:left; min-width:0; }
.as-link:hover .row-title { color:var(--text-primary); text-decoration:underline; text-decoration-color:var(--text-faint); text-underline-offset:3px; }
.row.current .row-title { font-weight:500; }
.seg-row { display:flex; gap:8px 20px; flex-wrap:wrap; }

/* ---- Dock states ---- */
.dock-main.single { grid-template-columns:minmax(0,1fr); }
.dock-main.triple { grid-template-columns:minmax(0,1fr) auto auto; }
.count-box { display:flex; flex-direction:column; justify-content:center; padding-left:14px; line-height:1.1; min-width:0; }
.count { font-size:30px; font-weight:300; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }

.btn-glass { background:rgba(255,255,255,.08); color:var(--text-primary); }
.btn-glass:hover { background:rgba(255,255,255,.12); }
.dock-link { align-self:center; font-size:12px; color:var(--text-faint); padding:0 8px 4px; transition:color 150ms var(--ease-standard); }

/* ---- Exercise sheet (floats, so it is glass) ---- */
.scrim { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); }
.sheet { position:fixed; z-index:41; left:50%; bottom:0; transform:translateX(-50%); width:min(560px, 100%); max-height:88vh; overflow:auto; box-sizing:border-box;
  border-radius:28px 28px 0 0; padding:20px 24px calc(28px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:16px; }

.sheet svg.stage { width:100%; }
.sheet-target { margin:0; font-size:14px; color:var(--text-primary); }
.cues { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
.cues li { font-size:14px; color:var(--text-secondary); padding-left:16px; position:relative; }
.cues li::before { content:""; position:absolute; left:2px; top:.62em; width:4px; height:4px; border-radius:50%; background:var(--text-faint); }

@media (min-width: 768px) {
  .sheet { bottom:auto; top:50%; transform:translate(-50%, -50%); border-radius:28px; max-height:86vh; }
  .stage-wrap { margin-top:-32px; }
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- Mannequin: 2D jointed figure, forward kinematics + two-bone IK, keyframed loops ----------
   Coordinates: viewBox 0 0 300 200, ground at y = 188, figure faces right (+x). Angles in degrees,
   measured clockwise from +x because SVG's y axis points down: 0 right, 90 down, -90 up, 180 left.
   A limb is either [upperAngle, lowerAngle] (absolute) or { t:[x,y], b } (world target, solved by IK). */
const RIG = (() => {
  const G = 188;
  const LEN = { torso:47, neck:5, head:15, ua:30, fa:29, th:44, sh:43, ft:13 };
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const dir = a => [Math.cos(rad(a)), Math.sin(rad(a))];
  const add = (p, a, l) => { const d = dir(a); return [p[0] + d[0] * l, p[1] + d[1] * l]; };
  const lerp = (a, b, u) => a + (b - a) * u;
  const angLerp = (a, b, u) => { let d = ((b - a) % 360 + 540) % 360 - 180; return a + d * u; };
  const norm = a => ((a % 360) + 540) % 360 - 180;
  const ease = u => 0.5 - Math.cos(Math.PI * u) / 2;

  function bases(p, front) {
    const hip = p.hip, sh = add(hip, p.tor, LEN.torso), neck = add(hip, p.tor, LEN.torso + LEN.neck);
    const head = add(neck, p.tor + (p.hd || 0), LEN.head - LEN.neck + 6);
    const off = front ? 9 : 0, hoff = front ? 6 : 0;
    const perp = p.tor + 90; // in front view the right side of the screen is the figure's left
    return { hip, sh, neck, head,
      shN: add(sh, perp, off), shF: add(sh, perp, -off),
      hipN: add(hip, perp, hoff), hipF: add(hip, perp, -hoff) };
  }
  // Two-bone IK from base to target. b = +1 bends one way, -1 the other (knees use -1, elbows +1).
  function ik(base, t, l1, l2, b) {
    let dx = t[0] - base[0], dy = t[1] - base[1], d = Math.hypot(dx, dy);
    const dmax = l1 + l2 - 0.01, dmin = Math.abs(l1 - l2) + 0.01;
    const th = Math.atan2(dy, dx); d = Math.min(dmax, Math.max(dmin, d));
    const a = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
    const up = deg(th) + b * deg(a);
    const j = add(base, up, l1);
    const end = [base[0] + Math.cos(th) * d, base[1] + Math.sin(th) * d];
    return { j, end };
  }
  // Turn any limb spec into { end (world), b } for a given base.
  function resolve(spec, base, l1, l2, defB) {
    if (!Array.isArray(spec)) return { end: spec.t, b: spec.b ?? defB, world: true };
    const j = add(base, spec[0], l1), end = add(j, spec[1], l2);
    const th = deg(Math.atan2(end[1] - base[1], end[0] - base[0]));
    const bend = norm(spec[0] - th);
    return { end, b: Math.abs(bend) < 1 ? 0 : Math.sign(bend), world: false };
  }
  const LIMBS = [['aN','shN','ua','fa',1],['aF','shF','ua','fa',1],['lN','hipN','th','sh',-1],['lF','hipF','th','sh',-1]];
  function fill(k, front) {
    const p = { hd:0, fN:0, ...k };
    if (!p.aF) p.aF = shift(p.aN, front ? 0 : -5); if (!p.lF) p.lF = shift(p.lN, front ? 0 : -5);
    if (p.fF === undefined) p.fF = p.fN;
    return p;
  }
  function shift(spec, dx) { return Array.isArray(spec) ? spec : { t:[spec.t[0] + dx, spec.t[1]], b: spec.b }; }

  // Pose of an animation at normalised time u (0..1).
  function poseAt(anim, u) {
    const front = anim.view === 'front';
    if (!anim._k) anim._k = anim.keys.map(k => fill(k, front));
    const ks = anim._k; u = ((u % 1) + 1) % 1;
    let i = ks.length - 1; for (let j = 0; j < ks.length - 1; j++) if (u >= ks[j].t && u < ks[j + 1].t) { i = j; break; }
    const k0 = ks[i], k1 = ks[i + 1] || ks[0];
    const t1 = i + 1 < ks.length ? k1.t : 1 + ks[0].t;
    const v = t1 > k0.t ? ease((u - k0.t) / (t1 - k0.t)) : 0;
    const p = { hip:[lerp(k0.hip[0], k1.hip[0], v), lerp(k0.hip[1], k1.hip[1], v)], tor:angLerp(k0.tor, k1.tor, v), hd:lerp(k0.hd, k1.hd, v),
      fN:angLerp(k0.fN, k1.fN, v), fF:angLerp(k0.fF, k1.fF, v) };
    const B = bases(p, front), B0 = bases(k0, front), B1 = bases(k1, front);
    for (const [key, bk, l1k, l2k, defB] of LIMBS) {
      const l1 = LEN[l1k], l2 = LEN[l2k];
      const r0 = resolve(k0[key], B0[bk], l1, l2, defB), r1 = resolve(k1[key], B1[bk], l1, l2, defB);
      let end;
      if (r0.world && r1.world) end = [lerp(r0.end[0], r1.end[0], v), lerp(r0.end[1], r1.end[1], v)];
      else {
        const p0 = polar(B0[bk], r0.end), p1 = polar(B1[bk], r1.end);
        end = add(B[bk], angLerp(p0[0], p1[0], v), lerp(p0[1], p1[1], v));
      }
      const b = r0.b && r1.b ? (v < .5 ? r0.b : r1.b) : (r0.b || r1.b || defB);
      p[key] = ik(B[bk], end, l1, l2, b);
    }
    p.B = B; p.front = front;
    return p;
  }
  const polar = (base, end) => [deg(Math.atan2(end[1] - base[1], end[0] - base[0])), Math.hypot(end[0] - base[0], end[1] - base[1])];

  // ---- Drawing ----
  const NS = 'http://www.w3.org/2000/svg';
  const W = { torsoS:17, torsoF:23, pelvis:14, ua:8.5, fa:7.5, th:12, sh:10, ft:6.5, head:10.5 };
  function build(svg, anim) {
    svg.setAttribute('viewBox', '0 0 300 200'); svg.innerHTML = '';
    const g = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
    g('line', { x1:16, y1:G, x2:284, y2:G, class:'fig-ground' });
    if (anim.wall) g('line', { x1:anim.wall, y1:20, x2:anim.wall, y2:G, class:'fig-ground' });
    const seg = (cls, w) => g('line', { class:cls, 'stroke-width':w, 'stroke-linecap':'round' });
    const dot = () => g('circle', { r:1.8, class:'fig-joint' });
    const front = anim.view === 'front';
    const far = front ? 'fig-near' : 'fig-far';
    const E = {
      aF:[seg(far, W.ua), seg(far, W.fa)], lF:[seg(far, W.th), seg(far, W.sh)], fF:seg(far, W.ft),
      jF:[dot(), dot()],
      pelvis:seg('fig-torso', W.pelvis), torso:seg('fig-torso', front ? W.torsoF : W.torsoS),
      head:g('circle', { r:W.head, class:'fig-near' }),
      lN:[seg('fig-near', W.th), seg('fig-near', W.sh)], fN:seg('fig-near', W.ft),
      aN:[seg('fig-near', W.ua), seg('fig-near', W.fa)],
      jN:[dot(), dot()],
    };
    return E;
  }
  const setL = (el, a, b) => { el.setAttribute('x1', a[0].toFixed(1)); el.setAttribute('y1', a[1].toFixed(1)); el.setAttribute('x2', b[0].toFixed(1)); el.setAttribute('y2', b[1].toFixed(1)); };
  function draw(E, p) {
    const B = p.B, flen = p.front ? 8 : LEN.ft;
    setL(E.aF[0], B.shF, p.aF.j); setL(E.aF[1], p.aF.j, p.aF.end);
    setL(E.lF[0], B.hipF, p.lF.j); setL(E.lF[1], p.lF.j, p.lF.end); setL(E.fF, p.lF.end, add(p.lF.end, p.fF, flen));
    setL(E.pelvis, B.hip, add(B.hip, p.tor, 16)); setL(E.torso, add(B.hip, p.tor, 20), add(B.hip, p.tor, LEN.torso));
    E.head.setAttribute('cx', B.head[0].toFixed(1)); E.head.setAttribute('cy', B.head[1].toFixed(1));

  line('Sleep', 12, true); line(d.sleep.map(([n, c]) => `${n}: ${c}`).join('. ') + '.'); gap(6);
  line('Training', 12, true); line(`Gym days logged: ${d.gymDays}. Lever sessions: ${d.sessions.length}, of which ${d.gentle} gentle (chosen on days at ${THRESHOLD}/10 or above).`); gap(6);
  line('Current exercises', 12, true);

/* ---------- Form check (optional) ---------- */

}

let fcCtl = null;
async function runFormCheck() {
  const F = S.form, sample = S.caps.sample; if (!sample || !F.file) return;
  const name = (formOptions().find(o => o[0] === F.anim) || ['', 'this exercise'])[1];
  const prompt = `You are checking exercise form from one photo for someone who trains at home with a lumbar disc bulge.
Exercise: ${name}.
How it should look: ${(CUES[F.anim] || []).join(' ')}
Their program keeps the spine neutral: no rounding or over-arching of the lower back.
Judge only what the photo shows. If the body isn't clearly visible or it looks like a different exercise, say so in "summary", use verdict "unclear" and leave the lists empty. Don't diagnose anything.
Reply with only JSON: {"verdict":"good"|"adjust"|"unclear","summary":"one plain sentence","good":["up to 3 short points"],"fix":["up to 3 short, specific corrections"]}`;
  fcCtl = new AbortController(); F.busy = true; F.error = null; F.result = null; render(false);
  try {
    const r = await sample.json(prompt, { images:[F.file], modelTier:'default', signal:fcCtl.signal });
    const res = { verdict:['good','adjust','unclear'].includes(r && r.verdict) ? r.verdict : 'unclear', summary:String((r && r.summary) || ''),
      good:Array.isArray(r && r.good) ? r.good.slice(0, 3).map(String) : [], fix:Array.isArray(r && r.fix) ? r.fix.slice(0, 3).map(String) : [] };
    F.result = res; saveForm({ id:'f' + Date.now(), kind:'form', at:Date.now(), anim:F.anim, name, ...res });
    if (F.url) URL.revokeObjectURL(F.url); F.url = null; F.file = null; // the photo is discarded
  } catch (e) {
    const c = e && e.code;
    F.error = c === 'cancelled' ? null : c === 'image_rejected' ? 'That photo couldn’t be read. Try a JPEG or PNG under 20 MB.' : c === 'not_granted' || c === 'sampling_disabled' ? 'Form check needs permission to use Claude.' :
      c === 'rate_limited' ? 'Too many checks for now. Try again later.' : c === 'refused' ? 'Claude couldn’t check this photo. Try a different one.' : 'The check didn’t finish. Try again.';
  } finally { F.busy = false; fcCtl = null; render(false); }
}

    else if (t.kind === 'hold') html = A.hold ? `<div class="dock-main"><div class="count-box"><span class="count mono" id="holdtime">0:00</span><span class="count-sub">Hold as long as you can</span></div><button class="btn btn-primary" data-act="teststop">Stop</button></div>`

    else html = A.timer ? `<div class="dock-main"><div class="count-box"><span class="count mono" id="testcount">${mmss((A.timer - Date.now()) / 1000)}</span><span class="count-sub">Keep counting</span></div><button class="btn-quiet" data-act="teststopclock">Stop early</button></div>`
              : A.timerDone ? `<div class="dock-main">${stepper('reps')}<button class="btn btn-primary" data-act="testsave">Save result</button></div>`

      : `<div class="dock-main">${stepper('sec')}<button class="btn btn-primary" data-act="holdstart">Start timer</button></div><button class="dock-link" data-act="log">Log ${A.val} s without the timer</button>`);
  } else {

      : `<div class="dock-main dual"><button class="btn btn-primary" data-act="gstart">Start ${label}</button><button class="btn-quiet" data-act="skipphase">${A.phase === 'cooldown' ? 'Skip and finish' : 'Skip'}</button></div>`;

    else { const seg = g.seq[g.i], lbl = seg.type === 'work' ? (seg.ex ? 'Work' : seg.name) : seg.type === 'rest' ? 'Rest' : 'Get ready';
      html = `<div class="rest-line"><i id="seg-fill"></i></div><div class="dock-main triple"><div class="count-box"><span class="count mono" id="ccount">${mmss(segLeft() / 1000)}</span><span class="count-sub">${esc(lbl)}${seg.type === 'work' && seg.ex ? `, round ${seg.round} of ${A.circuitRounds}` : ''}</span></div>
        <button class="btn btn-glass" data-act="${g.state === 'pause' ? 'gresume' : 'gpause'}">${g.state === 'pause' ? 'Resume' : 'Pause'}</button><button class="btn-quiet" data-act="gskip">Skip</button></div>`; }
  }

/* ---------- Session logic ---------- */
function startSession(day, gentle) {
  const p = plan(), D = SESSIONS[day], c = D.custom, steps = {};
  for (const ex of [...D.core, ...D.circuit]) steps[ex] = gentle ? 0 : S.levels[ex];
  S.active = { type:'workout', day, name:D.name, gentle:!!gentle, length:S.length, startedAt:Date.now(), phase:'warmup', steps, core:[...D.core], circ:[...D.circuit], swaps:[],
    coreRounds: c ? (gentle ? Math.min(2, c.rounds) : c.rounds) : gentle ? 2 : p.coreRounds,
    circuitRounds: c ? (gentle ? Math.min(2, c.circRounds) : c.circRounds) : gentle ? 2 : p.circuitRounds,
    on: c ? c.on : gentle ? 20 : p.on, off: c ? c.off : gentle ? 40 : p.off, week:p.week,
    log:{}, focus:null, hold:null, val:0, warm:{ state:'idle' }, circuit:{ state:'idle' }, cool:{ state:'idle' }, hist:[] };
  if (D.core.length) S.active.val = defaultVal(D.core[0]);
  S.rest = null; saveActive(); S.page = 'today'; window.scrollTo(0, 0); render(true);
}
function defaultVal(ex) {
  const L = LADDERS[ex], A = S.active, v = A && A.log && A.log[ex]; if (v && v.length) return v[v.length - 1];
  const e = lastCore(ex); return e && !(A && A.gentle) ? e.values[0] : L.lo;
}
function logValue(v) {
  const A = S.active, it = focusItem(A);
  (A.log[it.ex] = A.log[it.ex] || []).push(v); A.hist.push(it.ex); A.hold = null; A.focus = null;
  const next = currentItem(A);
  if (!next) { A.phase = firstPhaseAfter(A, 'core'); S.rest = null; toast(A.phase === 'circuit' ? 'Core done. The circuit is next.' : 'Core done. Cool down next.'); saveActive(); window.scrollTo({ top:0, behavior:RM ? 'auto' : 'smooth' }); render(true); return; }
  A.val = defaultVal(next.ex);
  if (S.autoRest) { const secs = next.round > it.round ? REST.round : REST.between; S.rest = { until:Date.now() + secs * 1000, total:secs * 1000 }; }
  saveActive(); render(false);
}
function startGuide() {
  const A = S.active, g = G(A); beep(660, 60, .001);
  g.seq = guideSeq(A, A.phase); g.i = 0; g.state = 'run'; g.endsAt = Date.now() + g.seq[0].dur * 1000; g.lastSec = null;
  saveActive(); render(false);
}
function phaseDone() {
  const A = S.active;
  if (A.phase === 'warmup') { A.phase = firstPhaseAfter(A, 'warmup'); toast(`Warm-up done. ${A.phase === 'core' ? 'Core' : A.phase === 'circuit' ? 'The circuit' : 'Cool-down'} is next.`); }
  else if (A.phase === 'circuit') { A.phase = 'cooldown'; toast('Circuit done. Cool down next.'); }
  else toast('All done. Finish to save the session.');
  saveActive(); window.scrollTo({ top:0, behavior:RM ? 'auto' : 'smooth' }); render(true);
}
function advanceSeg(manual) {
  const A = S.active, g = G(A);
  g.i++;
  if (g.i >= g.seq.length) { g.state = 'done'; beep(1046, 400); buzz([120, 80, 120]); phaseDone(); return; }
  const seg = g.seq[g.i]; g.endsAt = (manual ? Date.now() : g.endsAt) + seg.dur * 1000; g.lastSec = null;
  beep(seg.type === 'work' ? 988 : 523, seg.type === 'work' ? 220 : 160); buzz(seg.type === 'work' ? 200 : 80);
  saveActive(); render(false);
}
function finish() {
  const A = S.active;
  if (A.type === 'test') return;
  const D = sess(A);
  const core = D.core.filter(ex => (A.log[ex] || []).length).map(ex => ({ ex, step:A.steps[ex], values:A.log[ex] }));
  const roundsDone = Math.floor(circuitDone(A) / (D.circuit.length || 1));
  S.active = null; S.rest = null; saveActive();
  if (!core.length && !roundsDone) { toast('Nothing logged, so nothing was saved'); render(false); return; }
  const s = { id:'s' + Date.now(), kind:'session', v:2, type:'workout', day:A.day, name:D.name, swaps:A.swaps || [], gentle:A.gentle, length:A.length, week:A.week, startedAt:A.startedAt, endedAt:Date.now(), core,
    warmup:A.warm.state === 'done', cooldown:A.cool.state === 'done',
    circuit:{ exs:D.circuit.map(ex => ({ ex, step:A.steps[ex] })), on:A.on, off:A.off, rounds:A.circuitRounds, roundsDone } };
  saveSession(s); S.dayPick = null; S.open = s.id; S.page = 'history'; window.scrollTo(0, 0); render(true);
  const r = A.gentle ? 0 : core.filter(e => ready(e.ex)).length;
  toast(r ? `Session saved. ${r === 1 ? 'One exercise is' : r + ' exercises are'} ready to move up.` : 'Session saved');
  openAny({ type:'effort', id:s.id });
}
function startTest() { S.active = { type:'test', startedAt:Date.now(), step:0, results:{}, val:10, hold:null, timer:null, timerDone:false }; S.rest = null; saveActive(); S.page = 'today'; window.scrollTo(0, 0); render(true); }
function testRecord(v) {
  const A = S.active, t = TESTS[A.step]; A.results[t.key] = v; A.hold = null; A.timer = null; A.timerDone = false;
  if (A.step < TESTS.length - 1) { A.step++; A.val = TESTS[A.step].kind === 'timed' ? 20 : 10; saveActive(); render(true); return; }
  const isFirst = tests().length === 0, mapped = levelsFromTest(A.results);
  for (const [k, lv] of Object.entries(mapped)) S.levels[k] = isFirst ? lv : Math.max(S.levels[k], lv);
  const s = { id:'t' + Date.now(), kind:'session', v:2, type:'test', startedAt:A.startedAt, endedAt:Date.now(), tests:{ ...A.results } };
  S.active = null; saveActive(); saveSession(s); saveProgram(); window.scrollTo(0, 0); render(true);
  toast(isFirst ? 'Test saved. Your starting steps are set.' : 'Retest saved. Steps updated where you improved.');
}

/* ---------- Timers: update text only, re-render only on phase changes ---------- */
function restTick() {
  const fill = $('#rest-fill'); if (!S.rest || !fill) return;

  fill.style.transition = 'none'; fill.style.transform = `scaleX(${left / S.rest.total})`; fill.offsetWidth;
  fill.style.transition = `transform ${left}ms linear`; fill.style.transform = 'scaleX(0)';
}
function segTick(fresh) {
  const A = S.active; if (!A || A.type !== 'workout') return; const g = G(A); if (!g || !g.seq || ['idle','done'].includes(g.state)) return;
  const seg = g.seq[g.i], left = segLeft(), fill = $('#seg-fill'), cc = $('#ccount');
  if (cc) cc.textContent = mmss(Math.ceil(left / 1000));

    if (g.state === 'run') { fill.style.transition = `transform ${left}ms linear`; fill.style.transform = 'scaleX(0)'; } }
}
setInterval(() => {
  const A = S.active; if (!A) return;

    if (left <= 0) { A.timer = null; A.timerDone = true; beep(1046, 400); buzz([120, 80, 120]); saveActive(); renderDock(); } }

    if (g && g.state === 'run') { const left = g.endsAt - Date.now();
      if (left <= 0) advanceSeg(false);

/* ---------- Standalone: files, backup, offline ---------- */
const STANDALONE = true;
const MIME = { ics:'text/calendar', pdf:'application/pdf', json:'application/json' };
const localDownloads = {
  async save({ filename, data }) {
    const ext = filename.split('.').pop(), type = MIME[ext] || 'application/octet-stream';
    const blob = data instanceof Blob ? new Blob([data], { type }) : new Blob([data], { type });
    const touch = matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.canShare) {
      const file = new File([blob], filename, { type });
      if (navigator.canShare({ files:[file] })) {
        try { await navigator.share({ files:[file], title:filename }); return { status:'saved' }; }
        catch (e) { if (e && e.name === 'AbortError') throw { code:'declined' }; }
      }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { status:'saved' };
  }
};
S.caps.downloads = localDownloads;

function backupSection() {
  const n = S.sessions.filter(x => x.v === 2).length + S.gym.length + S.checkins.length;
  return section('Backup', n ? `${n} records` : '', `
    <p class="fc-note">Everything lives on this phone. Save a backup now and then, and use it to move your history to a new phone.</p>
    <div class="sheet-actions" style="margin-top:12px">
      <button class="btn btn-glass btn-sm2" data-act="bk-export">Save backup</button>
      <button class="btn btn-glass btn-sm2" data-act="bk-import">Restore</button>
    </div>
    <input type="file" id="bk-file" accept="application/json,.json" hidden>`);
}
async function exportBackup() {
  const prog = { levels:Object.fromEntries(Object.entries(S.levels).filter(([k]) => LADDERS[k] && !LADDERS[k].synthetic)), skipped:S.skipped, plan:S.plan, times:S.times, adjust:S.adjust };
  const body = JSON.stringify({ app:'lever', v:2, at:Date.now(), program:prog,
    sessions:S.sessions.filter(x => x.v === 2), checkins:S.checkins, gym:S.gym, customs:S.customs }, null, 1);
  try { await localDownloads.save({ filename:`lever-backup-${isoDay()}.json`, data:body }); toast('Backup ready'); }
  catch (e) { if (!e || e.code !== 'declined') toast('Couldn’t save the backup.'); }
}
async function importBackup(file) {
  let d; try { d = JSON.parse(await file.text()); } catch { toast('That file isn’t a Lever backup.'); return; }
  if (!d || d.app !== 'lever') { toast('That file isn’t a Lever backup.'); return; }
  const fresh = !S.sessions.length && !S.gym.length;
  const merge = (key, ls, rows) => { if (!Array.isArray(rows)) return 0;
    const ids = new Set(S[key].map(x => x.id)), add = rows.filter(r => r && r.id && !ids.has(r.id));
    S[key] = [...S[key], ...add]; LS.set(ls, key === 'sessions' ? S.sessions.filter(x => x.v === 2) : S[key]); return add.length; };
  const added = merge('sessions', 'lever2.sessions', d.sessions) + merge('checkins', 'lever2.checkins', d.checkins)
    + merge('gym', 'lever2.gym', d.gym) + merge('customs', 'lever2.customs', d.customs);
  if (d.program && fresh) { applyProg(d.program); saveProgram(); }
  else if (d.program && d.program.levels) { for (const [k, v] of Object.entries(d.program.levels)) if (S.levels[k] == null || v > S.levels[k]) S.levels[k] = v; saveProgram(); }
  registerCustoms(); render(false);
  toast(added ? `Restored ${added} records` : 'Nothing new in that backup');
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

render(true);
initStore();
</script>
</body>
</html>
